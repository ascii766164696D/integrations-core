name: Validate Renovate config

on:
  pull_request:
    paths:
      - 'renovate.json'
  push:
    branches:
      - master
    paths:
      - 'renovate.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate Renovate config
        run: npx --yes --package renovate renovate-config-validator --strict renovate.json
